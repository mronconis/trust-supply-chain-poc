apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: trusted-supply-chain
  namespace: trusted-supply-chain
  labels:
    app.kubernetes.io/part-of: trusted-supply-chain
  annotations:
    description: |
      Pipeline end-to-end per la Trusted Software Supply Chain.
      Build → SBOM → Security Gate → Sign & Push
spec:
  description: |
    Implements the full trusted software supply chain:
    1. Build the Quarkus container image and push to Quay.io
    2. Generate a CycloneDX SBOM and ingest into GUAC
    3. Enforce a security gate (fail on CRITICAL CVEs)
    4. Sign the image with Cosign (static key) and verify
  params:
    - name: IMAGE
      description: Target image reference
      type: string
      default: "quay.io/mronconi/trusted-supply-chain-app:latest"
    - name: GIT_URL
      description: Git repository URL
      type: string
      default: "https://github.com/mronconi/trust-supply-chain-poc.git"
    - name: GIT_REVISION
      description: Git branch/tag/commit
      type: string
      default: "main"
    - name: FAIL_ON_SEVERITY
      description: Minimum CVE severity to block the pipeline
      type: string
      default: "critical"

  workspaces:
    - name: shared-workspace
      description: Shared workspace for source code and artifacts
    - name: dockerconfig
      description: Docker registry credentials
    - name: cosign-keys
      description: Cosign signing keys

  tasks:
    # ──────────────────────────────────────────────────────────────
    # STAGE 1: Build & Push
    # ──────────────────────────────────────────────────────────────
    - name: build-and-push
      taskRef:
        name: build-and-push
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: GIT_URL
          value: $(params.GIT_URL)
        - name: GIT_REVISION
          value: $(params.GIT_REVISION)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    # ──────────────────────────────────────────────────────────────
    # STAGE 2: Generate SBOM & Attest
    # ──────────────────────────────────────────────────────────────
    - name: generate-sbom
      runAfter:
        - build-and-push
      taskRef:
        name: generate-sbom
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_DIGEST
          value: $(tasks.build-and-push.results.IMAGE_DIGEST)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: cosign-keys
          workspace: cosign-keys
        - name: dockerconfig
          workspace: dockerconfig

    # ──────────────────────────────────────────────────────────────
    # STAGE 3: Security Gate (GUAC + Grype)
    # ──────────────────────────────────────────────────────────────
    - name: security-gate
      runAfter:
        - generate-sbom
      taskRef:
        name: security-gate
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: FAIL_ON_SEVERITY
          value: $(params.FAIL_ON_SEVERITY)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    # ──────────────────────────────────────────────────────────────
    # STAGE 4: Sign & Verify (runs ONLY if gate passes)
    # ──────────────────────────────────────────────────────────────
    - name: cosign-sign
      runAfter:
        - security-gate
      taskRef:
        name: cosign-sign
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_DIGEST
          value: $(tasks.build-and-push.results.IMAGE_DIGEST)
      workspaces:
        - name: cosign-keys
          workspace: cosign-keys
        - name: dockerconfig
          workspace: dockerconfig

  results:
    - name: IMAGE_DIGEST
      description: Digest of the built image
      value: $(tasks.build-and-push.results.IMAGE_DIGEST)
    - name: IMAGE_URL
      description: Full image URL with digest
      value: $(tasks.build-and-push.results.IMAGE_URL)
    - name: SBOM_COMPONENT_COUNT
      description: Number of components in SBOM
      value: $(tasks.generate-sbom.results.SBOM_COMPONENT_COUNT)
    - name: GATE_RESULT
      description: Security gate result
      value: $(tasks.security-gate.results.GATE_RESULT)
    - name: CRITICAL_COUNT
      description: Critical CVE count
      value: $(tasks.security-gate.results.CRITICAL_COUNT)
    - name: SIGNED_IMAGE
      description: Signed image reference
      value: $(tasks.cosign-sign.results.SIGNED_IMAGE)

  finally:
    - name: summary
      taskSpec:
        steps:
          - name: print-summary
            image: alpine:3.20
            script: |
              #!/usr/bin/env sh
              echo ""
              echo "╔══════════════════════════════════════════════════════════════╗"
              echo "║       TRUSTED SUPPLY CHAIN — PIPELINE SUMMARY               ║"
              echo "╠══════════════════════════════════════════════════════════════╣"
              echo "║  Image     : $(params.IMAGE)"
              echo "║  Git       : $(params.GIT_URL) @ $(params.GIT_REVISION)"
              echo "║  Gate      : Fail on $(params.FAIL_ON_SEVERITY)+ severity"
              echo "╠══════════════════════════════════════════════════════════════╣"
              echo "║  If any task failed, the image was NOT signed.              ║"
              echo "║  Check the TaskRun logs for details.                        ║"
              echo "╚══════════════════════════════════════════════════════════════╝"
