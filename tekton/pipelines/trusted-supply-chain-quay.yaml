apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: trusted-supply-chain-quay
  namespace: trusted-supply-chain
  labels:
    app.kubernetes.io/part-of: trusted-supply-chain
spec:
  description: >
    Full trusted supply chain: git clone → build → push to Quay.io →
    SBOM → GUAC ingest → security gate → cosign sign & verify.
  params:
    - name: IMAGE
      type: string
      default: "quay.io/mronconi/trusted-supply-chain-app:latest"
    - name: GIT_URL
      type: string
      default: "https://github.com/mronconis/trust-supply-chain-poc.git"
    - name: GIT_REVISION
      type: string
      default: "main"
    - name: APP_CONTEXT
      type: string
      default: "quarkus-app"
    - name: FAIL_ON_SEVERITY
      type: string
      default: "critical"
  workspaces:
    - name: shared-workspace
    - name: cosign-keys
    - name: dockerconfig
    - name: cve-allowlist

  tasks:
    # ═══════════════════════════════════════════════════════════
    # Stage 1 — Git clone + Build + Push to Quay.io
    # ═══════════════════════════════════════════════════════════
    - name: build-and-push
      taskSpec:
        params:
          - name: IMAGE
            type: string
          - name: GIT_URL
            type: string
          - name: GIT_REVISION
            type: string
          - name: APP_CONTEXT
            type: string
        workspaces:
          - name: source
          - name: dockerconfig
        results:
          - name: IMAGE_DIGEST
          - name: IMAGE_URL
          - name: COMMIT_SHA
        steps:
          - name: git-clone
            image: alpine/git:2.47.2
            script: |
              #!/bin/sh
              set -eu
              echo "╔═══════════════════════════════════════════════════════════╗"
              echo "║  GIT CLONE                                               ║"
              echo "╠═══════════════════════════════════════════════════════════╣"
              echo "║  URL : $(params.GIT_URL)"
              echo "║  Rev : $(params.GIT_REVISION)"
              echo "╚═══════════════════════════════════════════════════════════╝"
              cd $(workspaces.source.path)
              rm -rf source && mkdir source && cd source
              git init
              git remote add origin "$(params.GIT_URL)"
              git fetch --depth 1 origin "$(params.GIT_REVISION)"
              git checkout FETCH_HEAD
              SHA=$(git rev-parse --short HEAD)
              echo "▸ Cloned at commit ${SHA}"
              printf "%s" "${SHA}" > $(results.COMMIT_SHA.path)

          - name: buildah-build-push
            image: quay.io/buildah/stable:v1.38
            securityContext:
              privileged: true
            script: |
              #!/bin/bash
              set -euo pipefail
              IMAGE="$(params.IMAGE)"
              AUTHFILE="$(workspaces.dockerconfig.path)/.dockerconfigjson"
              CONTEXT_DIR="$(workspaces.source.path)/source/$(params.APP_CONTEXT)"

              echo "╔═══════════════════════════════════════════════════════════╗"
              echo "║  BUILDAH BUILD & PUSH                                    ║"
              echo "╠═══════════════════════════════════════════════════════════╣"
              echo "║  Image   : ${IMAGE}"
              echo "║  Context : ${CONTEXT_DIR}"
              echo "╚═══════════════════════════════════════════════════════════╝"

              cd "${CONTEXT_DIR}"

              buildah bud \
                --format oci \
                --tls-verify=true \
                --layers \
                -f Dockerfile \
                -t "${IMAGE}" .

              echo "▸ Pushing to registry..."
              buildah push \
                --tls-verify=true \
                --authfile "${AUTHFILE}" \
                --digestfile /tmp/image-digest \
                "${IMAGE}" \
                "docker://${IMAGE}"

              DIGEST=$(cat /tmp/image-digest)
              echo "✅ Pushed ${IMAGE}@${DIGEST}"
              printf "%s" "${DIGEST}"              > $(results.IMAGE_DIGEST.path)
              printf "%s@%s" "${IMAGE}" "${DIGEST}" > $(results.IMAGE_URL.path)
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: GIT_URL
          value: $(params.GIT_URL)
        - name: GIT_REVISION
          value: $(params.GIT_REVISION)
        - name: APP_CONTEXT
          value: $(params.APP_CONTEXT)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    # ═══════════════════════════════════════════════════════════
    # Stage 2 — Generate SBOM
    # ═══════════════════════════════════════════════════════════
    - name: generate-sbom
      runAfter: [build-and-push]
      taskSpec:
        params:
          - name: IMAGE
            type: string
        workspaces:
          - name: source
          - name: dockerconfig
        results:
          - name: SBOM_COMPONENT_COUNT
        steps:
          - name: syft-generate
            image: alpine:3.20
            script: |
              #!/bin/sh
              set -eu
              echo "▸ Installing Syft..."
              wget -qO- https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

              IMAGE="$(params.IMAGE)"
              AUTHFILE="$(workspaces.dockerconfig.path)/.dockerconfigjson"
              echo "▸ Generating CycloneDX SBOM for ${IMAGE}"

              # Set up registry auth for Syft
              mkdir -p ~/.docker
              cp "${AUTHFILE}" ~/.docker/config.json

              syft "registry:${IMAGE}" \
                -o cyclonedx-json=$(workspaces.source.path)/sbom-cyclonedx.json

              COMPONENTS=$(grep -c '"bom-ref"' $(workspaces.source.path)/sbom-cyclonedx.json || echo "0")
              echo "✅ SBOM generated — ${COMPONENTS} components"
              printf "%s" "${COMPONENTS}" > $(results.SBOM_COMPONENT_COUNT.path)
      params:
        - name: IMAGE
          value: $(params.IMAGE)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig

    # ═══════════════════════════════════════════════════════════
    # Stage 3 — Vulnerability scan + GUAC ingest + security gate
    # ═══════════════════════════════════════════════════════════
    - name: security-gate
      runAfter: [generate-sbom]
      taskSpec:
        params:
          - name: IMAGE
            type: string
          - name: FAIL_ON_SEVERITY
            type: string
        workspaces:
          - name: source
          - name: dockerconfig
          - name: cve-allowlist
        results:
          - name: GATE_RESULT
          - name: CRITICAL_COUNT
          - name: TOTAL_VULN_COUNT
        steps:
          - name: grype-scan
            image: alpine:3.20
            script: |
              #!/bin/sh
              set -eu
              echo "▸ Installing Grype..."
              wget -qO- https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
              SBOM_FILE="$(workspaces.source.path)/sbom-cyclonedx.json"
              echo "▸ Scanning SBOM for vulnerabilities"
              grype sbom:"${SBOM_FILE}" -o json --file $(workspaces.source.path)/grype-results.json || true
              echo ""
              echo "╔═══════════════════════════════════════════════════════════╗"
              echo "║  VULNERABILITY SCAN RESULTS                              ║"
              echo "╚═══════════════════════════════════════════════════════════╝"
              grype sbom:"${SBOM_FILE}" -o table || true

          - name: guac-ingest
            image: ghcr.io/guacsec/guac:v0.10.0
            script: |
              #!/bin/sh
              set -eu
              GUAC="http://guac-graphql.trusted-supply-chain.svc:8080/query"
              SBOM_FILE="$(workspaces.source.path)/sbom-cyclonedx.json"

              echo "▸ Ingesting SBOM into GUAC at ${GUAC}"
              /opt/guac/guacone collect files "${SBOM_FILE}" \
                --gql-addr "${GUAC}" 2>&1 || echo "⚠ GUAC ingest warning (non-blocking)"
              echo "✅ SBOM ingested into GUAC"

          - name: evaluate-gate
            image: python:3.12-alpine
            script: |
              #!/usr/bin/env python3
              """Security gate with CVE allowlist support."""
              import json, sys, pathlib

              FAIL_SEV = "$(params.FAIL_ON_SEVERITY)".upper()
              RESULTS  = "$(workspaces.source.path)/grype-results.json"
              ALLOW_F  = "$(workspaces.cve-allowlist.path)/cve-allowlist.json"

              SEV_ORDER = ["NEGLIGIBLE", "LOW", "MEDIUM", "HIGH", "CRITICAL"]
              fail_idx  = SEV_ORDER.index(FAIL_SEV) if FAIL_SEV in SEV_ORDER else 4

              allowlist = set()
              try:
                  data = json.loads(pathlib.Path(ALLOW_F).read_text())
                  for entry in data.get("allowlist", []):
                      allowlist.add(entry["id"])
                  print(f"▸ CVE allowlist loaded — {len(allowlist)} entries")
                  for cid in sorted(allowlist):
                      print(f"  ◦ {cid} (accepted)")
              except Exception:
                  print("▸ No CVE allowlist found")

              try:
                  results = json.loads(pathlib.Path(RESULTS).read_text())
              except Exception:
                  results = {"matches": []}

              matches = results.get("matches", [])
              total   = len(matches)
              counts  = {}
              blocking_cves = []

              for m in matches:
                  v   = m.get("vulnerability", {})
                  vid = v.get("id", "")
                  sev = v.get("severity", "UNKNOWN").upper()
                  counts[sev] = counts.get(sev, 0) + 1
                  if vid in allowlist:
                      continue
                  sev_idx = SEV_ORDER.index(sev) if sev in SEV_ORDER else -1
                  if sev_idx >= fail_idx:
                      art = m.get("artifact", {})
                      blocking_cves.append(
                          f"{vid} [{sev}] — {art.get('name','?')}:{art.get('version','?')}")

              print()
              print("╔═══════════════════════════════════════════════════════════╗")
              print("║  SECURITY GATE EVALUATION                                ║")
              print("╠═══════════════════════════════════════════════════════════╣")
              print(f"║  Threshold     : {FAIL_SEV}+")
              print(f"║  Total CVEs    : {total}")
              print(f"║  CRITICAL      : {counts.get('CRITICAL',0)}")
              print(f"║  HIGH          : {counts.get('HIGH',0)}")
              print(f"║  MEDIUM        : {counts.get('MEDIUM',0)}")
              print(f"║  LOW           : {counts.get('LOW',0)}")
              print(f"║  Allow-listed  : {len(allowlist)}")
              print(f"║  Blocking      : {len(blocking_cves)}")
              print("╚═══════════════════════════════════════════════════════════╝")

              pathlib.Path("$(results.CRITICAL_COUNT.path)").write_text(str(counts.get("CRITICAL",0)))
              pathlib.Path("$(results.TOTAL_VULN_COUNT.path)").write_text(str(total))

              if blocking_cves:
                  print("\n  BLOCKING CVEs (not in allowlist):")
                  for c in blocking_cves:
                      print(f"    ✗ {c}")
                  print(f"\n❌ SECURITY GATE FAILED — {len(blocking_cves)} blocking CVE(s)")
                  pathlib.Path("$(results.GATE_RESULT.path)").write_text("FAILED")
                  sys.exit(1)
              else:
                  print("\n✅ SECURITY GATE PASSED — no blocking CVEs outside allowlist")
                  pathlib.Path("$(results.GATE_RESULT.path)").write_text("PASSED")
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: FAIL_ON_SEVERITY
          value: $(params.FAIL_ON_SEVERITY)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: dockerconfig
          workspace: dockerconfig
        - name: cve-allowlist
          workspace: cve-allowlist

    # ═══════════════════════════════════════════════════════════
    # Stage 4 — Attest SBOM + Sign + Verify (only if gate passed)
    # ═══════════════════════════════════════════════════════════
    - name: sign-and-attest
      runAfter: [security-gate]
      taskSpec:
        params:
          - name: IMAGE
            type: string
          - name: IMAGE_DIGEST
            type: string
        workspaces:
          - name: source
          - name: cosign-keys
          - name: dockerconfig
        results:
          - name: SIGNED_IMAGE
        steps:
          - name: cosign-attest-sbom
            image: bitnami/cosign:latest
            env:
              - name: COSIGN_PASSWORD
                value: ""
            script: |
              #!/bin/bash
              set -euo pipefail
              IMAGE="$(params.IMAGE)@$(params.IMAGE_DIGEST)"

              # cosign needs the auth in ~/.docker/config.json format
              mkdir -p ~/.docker
              cp "$(workspaces.dockerconfig.path)/.dockerconfigjson" ~/.docker/config.json 2>/dev/null || true

              echo "▸ Attesting SBOM to ${IMAGE}"
              cosign attest \
                --key "$(workspaces.cosign-keys.path)/cosign.key" \
                --type cyclonedx \
                --predicate "$(workspaces.source.path)/sbom-cyclonedx.json" \
                --yes \
                "${IMAGE}"
              echo "✅ SBOM attestation attached"

          - name: cosign-sign
            image: bitnami/cosign:latest
            env:
              - name: COSIGN_PASSWORD
                value: ""
            script: |
              #!/bin/bash
              set -euo pipefail
              IMAGE="$(params.IMAGE)@$(params.IMAGE_DIGEST)"

              mkdir -p ~/.docker
              cp "$(workspaces.dockerconfig.path)/.dockerconfigjson" ~/.docker/config.json 2>/dev/null || true

              echo "╔═══════════════════════════════════════════════════════════╗"
              echo "║  COSIGN SIGN                                             ║"
              echo "╠═══════════════════════════════════════════════════════════╣"
              echo "║  Image : ${IMAGE}"
              echo "╚═══════════════════════════════════════════════════════════╝"
              cosign sign \
                --key "$(workspaces.cosign-keys.path)/cosign.key" \
                --yes \
                "${IMAGE}"
              echo "✅ Image signed successfully"
              printf "%s" "${IMAGE}" > $(results.SIGNED_IMAGE.path)

          - name: cosign-verify
            image: bitnami/cosign:latest
            script: |
              #!/bin/bash
              set -euo pipefail

              mkdir -p ~/.docker
              cp "$(workspaces.dockerconfig.path)/.dockerconfigjson" ~/.docker/config.json 2>/dev/null || true

              echo "▸ Verifying signature with public key..."
              cosign verify \
                --key "$(workspaces.cosign-keys.path)/cosign.pub" \
                --insecure-ignore-tlog \
                "$(params.IMAGE)"
              echo ""
              echo "✅ Signature verified — the chain of trust is intact"
      params:
        - name: IMAGE
          value: $(params.IMAGE)
        - name: IMAGE_DIGEST
          value: $(tasks.build-and-push.results.IMAGE_DIGEST)
      workspaces:
        - name: source
          workspace: shared-workspace
        - name: cosign-keys
          workspace: cosign-keys
        - name: dockerconfig
          workspace: dockerconfig

  finally:
    - name: pipeline-summary
      taskSpec:
        steps:
          - name: summary
            image: alpine:3.20
            script: |
              #!/bin/sh
              cat <<EOF

              ╔═══════════════════════════════════════════════════════════╗
              ║   TRUSTED SUPPLY CHAIN — PIPELINE COMPLETE              ║
              ╠═══════════════════════════════════════════════════════════╣
              ║   Image : $(params.IMAGE)
              ║   Source: $(params.GIT_URL) @ $(params.GIT_REVISION)
              ║   Gate  : $(params.FAIL_ON_SEVERITY)+
              ║                                                         ║
              ║   If any task failed, the image was NOT signed.         ║
              ║   Run: cosign verify --key cosign.pub $(params.IMAGE)   ║
              ╚═══════════════════════════════════════════════════════════╝
              EOF
