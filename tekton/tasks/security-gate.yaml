apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: security-gate
  namespace: trusted-supply-chain
  labels:
    app.kubernetes.io/part-of: trusted-supply-chain
spec:
  description: >
    Scans the SBOM with Grype, ingests into GUAC, and evaluates
    a security gate with CVE allowlist support.
  params:
    - name: IMAGE
      type: string
    - name: FAIL_ON_SEVERITY
      type: string
  workspaces:
    - name: source
    - name: dockerconfig
    - name: cve-allowlist
  results:
    - name: GATE_RESULT
    - name: CRITICAL_COUNT
    - name: TOTAL_VULN_COUNT
  steps:
    - name: grype-scan
      image: alpine:3.20
      script: |
        #!/bin/sh
        set -eu
        echo "▸ Installing Grype..."
        wget -qO- https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b /usr/local/bin
        SBOM_FILE="$(workspaces.source.path)/sbom-cyclonedx.json"
        echo "▸ Scanning SBOM for vulnerabilities"
        grype sbom:"${SBOM_FILE}" -o json --file $(workspaces.source.path)/grype-results.json || true
        echo ""
        echo "╔═══════════════════════════════════════════════════════════╗"
        echo "║  VULNERABILITY SCAN RESULTS                              ║"
        echo "╚═══════════════════════════════════════════════════════════╝"
        grype sbom:"${SBOM_FILE}" -o table || true

    - name: guac-ingest
      image: ghcr.io/guacsec/guac:v0.10.0
      script: |
        #!/bin/sh
        set -eu
        GUAC="http://guac-graphql.trusted-supply-chain.svc:8080/query"
        SBOM_FILE="$(workspaces.source.path)/sbom-cyclonedx.json"

        echo "▸ Ingesting SBOM into GUAC at ${GUAC}"
        /opt/guac/guacone collect files "${SBOM_FILE}" \
          --gql-addr "${GUAC}" 2>&1 || echo "⚠ GUAC ingest warning (non-blocking)"
        echo "✅ SBOM ingested into GUAC"

    - name: evaluate-gate
      image: python:3.12-alpine
      script: |
        #!/usr/bin/env python3
        """Security gate with CVE allowlist support."""
        import json, sys, pathlib

        FAIL_SEV = "$(params.FAIL_ON_SEVERITY)".upper()
        RESULTS  = "$(workspaces.source.path)/grype-results.json"
        ALLOW_F  = "$(workspaces.cve-allowlist.path)/cve-allowlist.json"

        SEV_ORDER = ["NEGLIGIBLE", "LOW", "MEDIUM", "HIGH", "CRITICAL"]
        fail_idx  = SEV_ORDER.index(FAIL_SEV) if FAIL_SEV in SEV_ORDER else 4

        allowlist = set()
        try:
            data = json.loads(pathlib.Path(ALLOW_F).read_text())
            for entry in data.get("allowlist", []):
                allowlist.add(entry["id"])
            print(f"▸ CVE allowlist loaded — {len(allowlist)} entries")
            for cid in sorted(allowlist):
                print(f"  ◦ {cid} (accepted)")
        except Exception:
            print("▸ No CVE allowlist found")

        try:
            results = json.loads(pathlib.Path(RESULTS).read_text())
        except Exception:
            results = {"matches": []}

        matches = results.get("matches", [])
        total   = len(matches)
        counts  = {}
        blocking_cves = []

        for m in matches:
            v   = m.get("vulnerability", {})
            vid = v.get("id", "")
            sev = v.get("severity", "UNKNOWN").upper()
            counts[sev] = counts.get(sev, 0) + 1
            if vid in allowlist:
                continue
            sev_idx = SEV_ORDER.index(sev) if sev in SEV_ORDER else -1
            if sev_idx >= fail_idx:
                art = m.get("artifact", {})
                blocking_cves.append(
                    f"{vid} [{sev}] — {art.get('name','?')}:{art.get('version','?')}")

        print()
        print("╔═══════════════════════════════════════════════════════════╗")
        print("║  SECURITY GATE EVALUATION                                ║")
        print("╠═══════════════════════════════════════════════════════════╣")
        print(f"║  Threshold     : {FAIL_SEV}+")
        print(f"║  Total CVEs    : {total}")
        print(f"║  CRITICAL      : {counts.get('CRITICAL',0)}")
        print(f"║  HIGH          : {counts.get('HIGH',0)}")
        print(f"║  MEDIUM        : {counts.get('MEDIUM',0)}")
        print(f"║  LOW           : {counts.get('LOW',0)}")
        print(f"║  Allow-listed  : {len(allowlist)}")
        print(f"║  Blocking      : {len(blocking_cves)}")
        print("╚═══════════════════════════════════════════════════════════╝")

        pathlib.Path("$(results.CRITICAL_COUNT.path)").write_text(str(counts.get("CRITICAL",0)))
        pathlib.Path("$(results.TOTAL_VULN_COUNT.path)").write_text(str(total))

        if blocking_cves:
            print("\n  BLOCKING CVEs (not in allowlist):")
            for c in blocking_cves:
                print(f"    ✗ {c}")
            print(f"\n❌ SECURITY GATE FAILED — {len(blocking_cves)} blocking CVE(s)")
            pathlib.Path("$(results.GATE_RESULT.path)").write_text("FAILED")
            sys.exit(1)
        else:
            print("\n✅ SECURITY GATE PASSED — no blocking CVEs outside allowlist")
            pathlib.Path("$(results.GATE_RESULT.path)").write_text("PASSED")
