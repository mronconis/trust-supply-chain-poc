# Kind cluster configuration for the Trusted Supply Chain PoC
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: trusted-supply-chain
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      # NodePort range for accessing services from host
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
      - containerPort: 30443
        hostPort: 30443
        protocol: TCP
  - role: worker
    labels:
      workload: pipelines
